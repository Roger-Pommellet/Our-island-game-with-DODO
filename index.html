<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Our Island 5.0 beta</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="launcher.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="pill" id="coin">🪙 0</div>
    <div class="pill" id="who"></div>
    <button class="pill" id="snd">🔊</button>
    <button
      class="pill"
      id="jmp"
      style="
        top: auto;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
        right: 12px;
        pointer-events: auto;
        width: 54px;
        height: 54px;
        border-radius: 27px;
        font-size: 22px;
        padding: 0;
      "
    >
      ⤴
    </button>
    <button
      class="pill"
      id="home"
      title="Back to the village"
      style="
        top: auto;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
        right: 12px;
        pointer-events: auto;
        width: 54px;
        height: 54px;
        border-radius: 27px;
        font-size: 22px;
        padding: 0;
      "
    >
      🏡
    </button>
    <button
      class="pill"
      id="tabb"
      style="
        top: calc(env(safe-area-inset-top, 0px) + 52px);
        left: 12px;
        pointer-events: auto;
      "
    >
      📋 Tab
    </button>
    <div id="hint"></div>
    <div id="hot"></div>
    <div id="modal"></div>
    <div id="toast"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <div id="menu">
      <div class="box">
        <h1>🏝️ Our Island</h1>
        <div class="sub">beta 5.1</div>
        <div id="m0">
          <button id="bs">🌴 Play solo</button
          ><button id="bm" class="go">💕 Play together</button
          ><button id="br" class="sm">🗑 Reset solo island</button>
        </div>
        <div id="m1" hidden>
          <button id="bd" class="go">🔗 Direct link (no Claude account)</button
          ><button id="bo">☁️ Online save (Claude accounts)</button
          ><button class="bk">← Back</button>
        </div>
        <div id="m2" hidden>
          <button id="bc" class="go">▶ Continue our island</button
          ><button id="bn">✨ New shared island</button
          ><button id="bl">📨 Invite link for her</button
          ><input id="lk" readonly hidden /><button class="bk">← Back</button>
        </div>
        <div id="m3" hidden>
          <button id="dh" class="go">🏠 I'm hosting</button
          ><button id="dj">🚪 I'm joining</button
          ><button id="df">💾 Download game file for her</button
          ><button id="pl">▶ Play now (not connected, saves here)</button
          ><button id="ex" class="sm">📤 Save my changes to a file</button
          ><button id="imb" class="sm">📥 Load her changes file</button
          ><input id="im" type="file" hidden />
          <div id="dx" hidden>
            <div class="t" id="dt"></div>
            <textarea id="c1" rows="4" readonly></textarea
            ><textarea id="c2" rows="4"></textarea
            ><button id="go2" class="go"></button>
          </div>
          <button id="dr" class="sm">
            🗑 Reset together-save on this device</button
          ><button class="bk">← Back</button>
        </div>
        <div id="st"></div>
      </div>
    </div>
    <script src="launcher.js"></script>
  </body>
</html>
